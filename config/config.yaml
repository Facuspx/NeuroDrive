# =============================================================================
# NeuroDrive - Configuración global del sistema
# =============================================================================
# Este archivo centraliza TODOS los umbrales y parámetros ajustables.
# Lo leen los dos programas: el de visión y el núcleo. Toda clave que figura
# acá tiene un consumidor en el código; una clave desconocida se informa con
# una advertencia al cargar y se ignora.
#
# Convenciones:
#   - Tiempos en segundos (sufijo _seg)
#   - Ángulos en grados (sufijo _grados)
#   - Frecuencias en hertz o por minuto según contexto
#   - Pines GPIO según numeración BCM (no física)
# =============================================================================


# -----------------------------------------------------------------------------
# Máquina de estados finita (FSM)
# -----------------------------------------------------------------------------
fsm:
  # Tiempo mínimo sin eventos para considerar bajar de estado (histéresis)
  tiempo_para_bajar_estado_seg: 60

  # Señales leves continuas (parpadeo escaso, pulso bajo, PERCLOS elevado)
  calentamiento_senales_seg: 60.0        # ignorar parpadeos/min al arrancar
  persistencia_senales_leves_seg: 20.0   # cuánto deben sostenerse para PRE_ALERTA

  # PERCLOS: proporción de tiempo con los ojos cerrados en la ventana de 60 s.
  # Son TRES decisiones distintas, cada una con su umbral. No unificarlos.
  #   1) Corroborar un cabeceo: con PERCLOS >= este valor, un cabeceo se toma
  #      como de sueño (ALERTA_LEVE). Por debajo es una mirada al tablero
  #      (PRE_ALERTA).
  perclos_corroborar_cabeceo: 0.30
  #   2) Señal leve: PERCLOS > este valor cuenta como señal continua.
  perclos_senales_leves: 0.30
  #   3) Párpados pesados: PERCLOS >= este valor, sostenido el tiempo
  #      indicado, es un hecho confirmado aunque no haya microsueño.
  perclos_parpados_pesados: 0.35
  perclos_parpados_pesados_sostenido_seg: 30.0

  # Fatiga recurrente
  max_eventos_severos_ventana: 3         # episodios severos para declararla
  ventana_episodios_seg: 900.0           # 15 min
  umbral_respuesta_lenta_ms: 5000        # respuesta correcta pero lenta: baja un solo nivel


# -----------------------------------------------------------------------------
# Captura de video y detección facial
# -----------------------------------------------------------------------------
vision:
  # FPS deseado del pipeline de visión (la Pi 5 soporta 15-30 cómodo)
  fps_deseado: 15

  # Resolución a la que se analiza cada cuadro. La captura se hace con el
  # campo completo del sensor y se reduce a este tamaño.
  resolucion_ancho: 640
  resolucion_alto: 480

  # MediaPipe FaceMesh: confianza mínima para aceptar que hay un rostro y
  # para mantener el seguimiento entre cuadros.
  confianza_minima_deteccion: 0.5
  confianza_minima_seguimiento: 0.5

  # Cuántos frames consecutivos sin detección antes de declarar "rostro perdido"
  max_frames_sin_rostro: 15

  # Silencio máximo del programa de visión antes de declararlo fuera de
  # servicio. Publica unos 15 mensajes por segundo, haya rostro o no, de modo
  # que 5 s equivalen a unos 75 mensajes ausentes.
  timeout_silencio_seg: 5


# -----------------------------------------------------------------------------
# Análisis de ojos (EAR, parpadeos, microsueños)
# -----------------------------------------------------------------------------
ojos:
  # Relativo unificado: ear_base es el EAR del conductor con los ojos
  # abiertos, medido en la calibración. De él se derivan los dos umbrales, con
  # histéresis, que usan IGUAL la visión (pantalla) y el núcleo (FSM):
  #     ojo cerrado:  EAR < ear_base * factor_ear_cierre
  #     ojo abierto:  EAR > ear_base * factor_ear_apertura
  # Copiar ear_base del resultado de la calibración, igual que la postura
  # neutra de [cabeza].
  ear_base: 0.31
  factor_ear_cierre: 0.65      # umbral de cierre   = 0.31 * 0.65 = 0.2015
  factor_ear_apertura: 0.84    # umbral de apertura = 0.31 * 0.84 = 0.2604

  # Un cierre de hasta esta duración es un parpadeo; más largo, no cuenta
  dur_max_parpadeo_seg: 0.40

  # Duración mínima para clasificar como microsueño (crítico)
  dur_min_microsueno_seg: 1.5

  # Período refractario entre parpadeos (evita doble conteo)
  refractario_parpadeo_seg: 0.25

  # Parpadeos por minuto por debajo de los cuales hay señal leve. Lo normal
  # es 15 a 20. Cuánto debe sostenerse lo fija fsm.persistencia_senales_leves_seg.
  parpadeos_por_minuto_alerta: 10


# -----------------------------------------------------------------------------
# Análisis de boca (MAR, bostezos)
# -----------------------------------------------------------------------------
boca:
  # MAR (Mouth Aspect Ratio) por encima del cual se considera abierta
  umbral_mar_bostezo: 0.6

  # Histéresis: el bostezo termina cuando el MAR baja de
  # umbral_mar_bostezo * factor_mar_cierre (0.6 * 0.9 = 0.54)
  factor_mar_cierre: 0.9

  # Duración mínima de apertura para clasificar como bostezo (no hablar)
  dur_min_bostezo_seg: 1.0

  # Ventana larga para contar bostezos (15 minutos)
  ventana_bostezos_seg: 900

  # Cantidad de bostezos en esa ventana para considerar somnolencia
  max_bostezos_ventana_larga: 3


# -----------------------------------------------------------------------------
# Análisis de cabeza (cabeceo con ángulos de Euler)
# -----------------------------------------------------------------------------
cabeza:
  # Pitch positivo = cabeza hacia abajo. Umbral en grados, medido desde la
  # postura neutra del conductor.
  umbral_pitch_grados: 15

  # Histéresis: el cabeceo termina cuando el pitch baja de
  # umbral_pitch_grados * factor_pitch_fin_cabeceo (15 * 0.85 = 12.75)
  factor_pitch_fin_cabeceo: 0.85

  # Duración mínima sostenida del cabeceo para contarlo (segundos)
  dur_min_cabeceo_seg: 0.8

  # Yaw máximo permitido sin invalidar análisis de pitch (cabeza girada)
  umbral_yaw_max_grados: 35

  # Postura neutra del conductor (grados). La visión resta estos valores antes
  # de transmitir, de modo que los umbrales de arriba se aplican sobre
  # desviaciones respecto de la postura habitual y no sobre ángulos absolutos.
  # Copiarlos del resultado de la calibración, igual que ojos.ear_base.
  pitch_neutro_grados: 5.1
  yaw_neutro_grados: -9.5
  roll_neutro_grados: 0.5


# -----------------------------------------------------------------------------
# Wearable (pulsera ESP32-S3)
# -----------------------------------------------------------------------------
wearable:
  # Rango de BPM considerado normal en reposo/conducción
  bpm_normal_min: 60
  bpm_normal_max: 100

  # Umbrales para clasificar riesgo
  bpm_umbral_alerta: 70        # Por debajo, riesgo medio
  bpm_umbral_critico: 60       # Por debajo, riesgo alto

  # Ventana de respuesta a la verificación, por nivel de alerta: tiempo que
  # tiene el conductor para tocar el pad, contado desde el último pulso.
  # El valor viaja a la pulsera dentro de la orden (tipo 8, campo duracion_ms),
  # de modo que los dos extremos usan el mismo número.
  timeout_ack_leve_seg: 10
  timeout_ack_medio_seg: 7
  timeout_ack_critico_seg: 7

  # Margen que el núcleo suma a la ventana antes de dar por vencida la
  # verificación. Cubre lo que tarda la pulsera en emitir los pulsos antes de
  # abrir la ventana (peor caso: 4 pulsos x 500 ms = 2,0 s) más el tránsito
  # de la orden y de la respuesta. No bajar de 2.0.
  margen_presentacion_desafio_seg: 2.5

  # Silencio máximo de la pulsera antes de declararla fuera de servicio.
  # Transmite telemetría cada 2 s: 10 s equivalen a 5 mensajes ausentes.
  timeout_heartbeat_seg: 10

  # Intervalo entre telemetrías que fija el firmware (TELE_INTERVAL_MS). No
  # cambia el comportamiento del núcleo: se usa al cargar para comprobar que
  # timeout_heartbeat_seg sea mayor y no declare caídas falsas.
  intervalo_envio_bpm_seg: 2.0


# -----------------------------------------------------------------------------
# IPC (Inter-Process Communication)
# -----------------------------------------------------------------------------
ipc:
  # Modo de comunicación entre módulos externos y el Core
  modo: "posix_mq"

  # Nombres de las colas POSIX (deben empezar con /)
  cola_vision: "/neurodrive_vision"
  cola_wearable: "/neurodrive_wearable"

  # Capacidad de cada cola (cantidad de mensajes en buffer)
  capacidad_cola: 10

  # Tamaño máximo de mensaje en bytes (para POSIX MQ)
  tamano_max_mensaje_bytes: 1024


# -----------------------------------------------------------------------------
# Red (UDP con la pulsera)
# -----------------------------------------------------------------------------
red:
  # IP de la pulsera en la red local del vehículo (la fija el firmware)
  ip_wearable: "192.168.4.20"

  # Puerto UDP en el que la Raspberry escucha telemetría y respuestas
  puerto_udp_escucha: 5005

  # Puerto UDP de la pulsera, al que se envían las órdenes
  puerto_udp_envio: 5006

  # Órdenes críticas: cuántas veces se transmite el mismo paquete
  reenvios_comandos_criticos: 3

  # Espaciado entre repeticiones (ms)
  espaciado_reenvios_ms: 50


# -----------------------------------------------------------------------------
# Identificadores de dispositivos
# -----------------------------------------------------------------------------
identificadores:
  # ID del módulo de visión (útil cuando hay múltiples cámaras)
  id_camara: "cam-01"

  # ID del wearable (útil cuando hay múltiples pulseras)
  id_wearable: "wearable-01"

  # ID del proceso Core (siempre fijo, hay uno solo)
  id_core: "core"

  # Prefijo de los mensajes que genera el propio núcleo (fallas y
  # recuperaciones de fuentes)
  prefijo_mensaje_interno: "int"


# -----------------------------------------------------------------------------
# Actuadores locales
# -----------------------------------------------------------------------------
# El asistente de voz es una mejora futura: la FSM ya emite la orden
# REPRODUCIR_VOZ, pero no hay actuador que la ejecute ni parámetros acá.
actuadores:
  # Pin GPIO del buzzer (numeración BCM)
  buzzer_gpio_pin: 18


# -----------------------------------------------------------------------------
# Registro
# -----------------------------------------------------------------------------
# El núcleo escribe su registro por la salida estándar. Para conservarlo:
#     python main.py 2>&1 | tee sesion.log
logging:
  # Nivel global: DEBUG, INFO, WARNING, ERROR, CRITICAL
  nivel: "INFO"


# -----------------------------------------------------------------------------
# Persistencia de estado entre sesiones
# -----------------------------------------------------------------------------
sesion:
  # Archivo donde el núcleo guarda su estado en cada cambio y al apagarse.
  # Ruta relativa a la raíz del proyecto.
  archivo_estado: "NeuroDrive_Core/estado_sesion.json"

  # Plazo para considerar que es la misma sesión (segundos). Si entre el
  # último guardado y el arranque pasó más tiempo, se inicia en NORMAL.
  ttl_sesion_seg: 900   # 15 minutos
